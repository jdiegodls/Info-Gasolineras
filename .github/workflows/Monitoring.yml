name: monitoring
on:
  schedule:
    - cron: "0 13,17,21,1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: monitor
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WINDOW_DAYS: "7"
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
      - run: |
          git config user.name "monitor-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/items.json
          git diff --staged --quiet || (git commit -m "actualización automática" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: dep
        uses: actions/deploy-pages@v4
